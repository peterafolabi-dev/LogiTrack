{% extends 'base.html' %}
{% block title %}Password updated | LogiTrack{% endblock %}
{% block content %}
<section class="mx-auto mt-12 max-w-md rounded-2xl border border-zinc-200 bg-white p-6 text-center shadow-xl shadow-zinc-900/[0.04] sm:p-8">
  <div class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-emerald-50 text-emerald-700" aria-hidden="true">✓</div>
  <h1 class="mt-4 text-2xl font-semibold tracking-tight text-zinc-950">Password updated</h1>
  <p class="mt-2 text-sm leading-6 text-zinc-500">Your password has been changed. Sign in with your new credentials.</p>
  <a href="{% url 'login' %}" class="mt-6 inline-flex rounded-xl bg-zinc-950 px-4 py-3 text-sm font-semibold text-white transition-all duration-200 hover:bg-zinc-800">Continue to sign in</a>
</section>
{% endblock %}
